<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Alpine Trail Clock</title>
<style>
:root {
  --fg: #edf5ee; --muted: #b8cfc4; --accent: #e4d3a0; --accent2: #9ac4bb;
  --ring: #bfc9b2; --glow: rgba(230,217,162,.30); --bg1: #3a6175; --bg2: #223c40; --bg3: #071112;
}
* { box-sizing: border-box; }
html, body { width:100%; height:100%; margin:0; overflow:hidden; background:#000; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; color:var(--fg); }
#scene { position:relative; width:100%; height:100%; overflow:hidden; background: radial-gradient(ellipse at 50% 35%, var(--bg1), var(--bg2) 52%, var(--bg3) 100%); isolation:isolate; }
canvas.bg { position:absolute; inset:0; width:100%; height:100%; }
.vignette { position:absolute; inset:0; background: radial-gradient(circle at center, transparent 42%, rgba(0,0,0,.10) 72%, rgba(0,0,0,.40) 100%); pointer-events:none; }
.clock-wrap { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); display:flex; flex-direction:column; align-items:center; gap:min(1.35vh, 12px); width:min(78vw, 760px); }
.clock-face { width:min(41vw, 420px); height:min(41vw, 420px); min-width:240px; min-height:240px; max-width:420px; max-height:420px; }
.ticks line.major { stroke: color-mix(in oklab, var(--fg) 88%, var(--accent)); stroke-width:2.1; opacity:.8; }
.ticks line.minor { stroke: color-mix(in oklab, var(--fg) 55%, transparent); stroke-width:1; opacity:.25; }
.ring-outer { fill:none; stroke: color-mix(in oklab, var(--ring) 88%, white 8%); stroke-width:2.6; opacity:.88; filter: drop-shadow(0 0 10px var(--glow)); }
.ring-inner { fill:none; stroke: color-mix(in oklab, var(--ring) 74%, transparent); stroke-width:1.2; opacity:.32; }
.hand-glow { stroke-linecap:round; filter: blur(4px); opacity:.24; }
.hand { stroke-linecap:round; }
.center-pin { fill: color-mix(in oklab, var(--fg) 95%, white); filter: drop-shadow(0 0 8px var(--glow)); }
.readout { text-align:center; white-space:nowrap; font-variant-numeric: tabular-nums; text-shadow:0 0 12px color-mix(in oklab, var(--glow) 60%, transparent); }
.day { font-size: clamp(11px, 1.1vw, 14px); letter-spacing:.45em; text-transform:uppercase; color: color-mix(in oklab, var(--muted) 90%, white 8%); }
.rule { width:min(26vw, 220px); height:1px; background:linear-gradient(90deg, transparent, color-mix(in oklab, var(--accent) 78%, white 12%), transparent); opacity:.65; box-shadow:0 0 12px color-mix(in oklab, var(--glow) 50%, transparent); }
.date { font-size: clamp(12px, 1.2vw, 16px); letter-spacing:.16em; text-transform:uppercase; color: var(--muted); opacity:.95; }
.time { display:inline-flex; align-items:flex-end; justify-content:center; position:relative; font-size: clamp(30px, 4.5vw, 64px); font-weight:260; letter-spacing:.08em; color: color-mix(in oklab, var(--fg) 95%, white 5%); text-shadow:0 0 16px color-mix(in oklab, var(--glow) 72%, transparent); line-height:1; }
.time-num { display:inline-block; }
.ampm { position:absolute; left:100%; bottom:.18em; transform:translateX(.38em); font-size:.34em; letter-spacing:.18em; color: var(--muted); }
.label { position:absolute; bottom:min(3.2vh,24px); left:50%; transform:translateX(-50%); font-size:11px; letter-spacing:.28em; text-transform:uppercase; color: color-mix(in oklab, var(--muted) 90%, white 5%); opacity:.72; white-space:nowrap; }
</style>
</head>
<body>
<div id="scene">
  <canvas id="bg" class="bg"></canvas>
  <div class="clock-wrap">
    <svg class="clock-face" viewBox="0 0 320 320" aria-hidden="true">
      <circle cx="160" cy="160" r="145" class="ring-outer" />
      <circle cx="160" cy="160" r="121" class="ring-inner" />
      <g id="ticks" class="ticks"></g>
      <g id="hour"><line class="hand-glow" x1="160" y1="172" x2="160" y2="96" stroke="rgba(255,232,188,.76)" stroke-width="12"/><line class="hand" x1="160" y1="172" x2="160" y2="96" stroke="#fff3d6" stroke-width="5.4"/></g>
      <g id="minute"><line class="hand-glow" x1="160" y1="178" x2="160" y2="58" stroke="rgba(216,235,233,.74)" stroke-width="8"/><line class="hand" x1="160" y1="178" x2="160" y2="58" stroke="#eef9f6" stroke-width="3.2"/></g>
      <g id="second"><line class="hand-glow" x1="160" y1="190" x2="160" y2="40" stroke="rgba(173,218,205,.72)" stroke-width="6"/><line class="hand" x1="160" y1="190" x2="160" y2="40" stroke="#b8ead8" stroke-width="1.8"/></g>
      <circle cx="160" cy="160" r="4.2" class="center-pin"/>
    </svg>
    <div class="readout">
      <div class="day" id="day">TUESDAY</div>
      <div class="rule"></div>
      <div class="date" id="date">NOVEMBER 17, 2026</div>
      <div class="time"><span class="time-num" id="timeNum">10:52:50</span><span class="ampm" id="ampm">AM</span></div>
    </div>
  </div>
  <div class="vignette"></div>
  <div class="label">Alpine Trail</div>
</div>
<script>
(() => {
  const ns='http://www.w3.org/2000/svg';
  const ticks=document.getElementById('ticks');
  for(let i=0;i<60;i++){
    const a=i*Math.PI/30, major=i%5===0;
    const r1=major?124:132, r2=major?143:140;
    const line=document.createElementNS(ns,'line');
    line.setAttribute('x1',160+Math.sin(a)*r1); line.setAttribute('y1',160-Math.cos(a)*r1);
    line.setAttribute('x2',160+Math.sin(a)*r2); line.setAttribute('y2',160-Math.cos(a)*r2);
    line.setAttribute('class', major ? 'major':'minor'); ticks.appendChild(line);
  }
  const H=document.getElementById('hour'), M=document.getElementById('minute'), S=document.getElementById('second');
  const dayEl=document.getElementById('day'), dateEl=document.getElementById('date');
  const timeNumEl=document.getElementById('timeNum'), ampmEl=document.getElementById('ampm');
  let lastSec=-1;
  function clockFrame(){
    const d=new Date();
    const s=d.getSeconds()+d.getMilliseconds()/1000;
    const m=d.getMinutes()+s/60;
    const h=(d.getHours()%12)+m/60;
    H.setAttribute('transform',`rotate(${h*30} 160 160)`);
    M.setAttribute('transform',`rotate(${m*6} 160 160)`);
    S.setAttribute('transform',`rotate(${s*6} 160 160)`);
    if(d.getSeconds()!==lastSec){
      lastSec=d.getSeconds();
      dayEl.textContent=new Intl.DateTimeFormat('en-US',{weekday:'long'}).format(d).toUpperCase();
      dateEl.textContent=new Intl.DateTimeFormat('en-US',{month:'long',day:'numeric',year:'numeric'}).format(d).toUpperCase();
      timeNumEl.textContent=`${d.getHours()%12||12}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;
      ampmEl.textContent=d.getHours()<12?'AM':'PM';
    }
    requestAnimationFrame(clockFrame);
  }
  clockFrame();
  const scene=document.getElementById('scene');
  const canvas=document.getElementById('bg');
  const ctx=canvas.getContext('2d');
  let w=0,h=0, dpr=1;
  function resize(){
    const r=scene.getBoundingClientRect();
    w=r.width; h=r.height;
    dpr=Math.min(window.devicePixelRatio||1,1.5);
    canvas.width=w*dpr; canvas.height=h*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
    if (typeof onResize === 'function') onResize();
  }
  window.addEventListener('resize', resize);
  
  let grasses=[], clouds=[];
  function onResize(){
    grasses=[...Array(30)].map((_,i)=>({x:i/29, h:8+((i*19)%22), phase:Math.random()*6.28}));
    clouds=[...Array(9)].map((_,i)=>({x:Math.random()*w, y:h*(.09+.18*Math.random()), s:24+Math.random()*44, v:.025+Math.random()*.06, puff:3+Math.floor(Math.random()*4), phase:Math.random()*6.28}));
  }
  function mountain(points, fill){ ctx.beginPath(); ctx.moveTo(0,h); for(const p of points) ctx.lineTo(p[0],p[1]); ctx.lineTo(w,h); ctx.closePath(); ctx.fillStyle=fill; ctx.fill(); }
  function ridgeY(x){ return h*(.86 - .09*Math.exp(-Math.pow((x/w-.5)/.19,2)) + .01*Math.sin(x*.008)); }
  function drawCloud(c,t){
    c.x += c.v; if(c.x>w+120) c.x=-120;
    const y=c.y + Math.sin(t*.15+c.phase)*6; ctx.fillStyle='rgba(255,255,255,.065)';
    for(let i=0;i<c.puff;i++){
      const ox=(i-(c.puff-1)/2)*c.s*.42; const oy=Math.sin(i*1.3+c.phase)*4; const rx=c.s*(.42+.1*(i%2)); const ry=c.s*(.18+.04*((i+1)%2));
      ctx.beginPath(); ctx.ellipse(c.x+ox, y+oy, rx, ry, 0, 0, Math.PI*2); ctx.fill();
    }
  }
  function draw(ts){
    const t=ts*0.001; ctx.clearRect(0,0,w,h);
    const sky=ctx.createLinearGradient(0,0,0,h); sky.addColorStop(0,'rgba(255,216,181,.18)'); sky.addColorStop(.45,'rgba(131,189,214,.10)'); sky.addColorStop(1,'rgba(13,26,29,0)'); ctx.fillStyle=sky; ctx.fillRect(0,0,w,h);
    mountain([[0,h*.63],[w*.10,h*.52],[w*.22,h*.60],[w*.33,h*.46],[w*.47,h*.58],[w*.60,h*.43],[w*.74,h*.57],[w*.88,h*.48],[w,h*.54]],'rgba(76,105,109,.46)');
    mountain([[0,h*.74],[w*.12,h*.58],[w*.25,h*.68],[w*.38,h*.53],[w*.52,h*.70],[w*.67,h*.55],[w*.80,h*.65],[w,h*.57]],'rgba(47,78,69,.70)');
    ctx.beginPath(); ctx.moveTo(0,h); for(let x=0;x<=w;x+=16) ctx.lineTo(x, ridgeY(x)); ctx.lineTo(w,h); ctx.closePath(); ctx.fillStyle='rgba(22,43,32,.96)'; ctx.fill();
    clouds.forEach(c=>drawCloud(c,t));
    for(const g of grasses){ const x=g.x*w; const y=ridgeY(x)-1; const sway=Math.sin(t*.9+g.phase)*2.0; ctx.strokeStyle='rgba(218,202,166,.22)'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+sway,y-(g.h)); ctx.stroke(); }
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);

  resize();
})();
</script>
</body></html>
