<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Forest Canopy Clock</title>
<style>
:root {
  --fg: #e5f3de; --muted: #adc7a7; --accent: #d8b86f; --accent2: #86c56e;
  --ring: #9dbd84; --glow: rgba(222,210,156,.35); --bg1: #1f4026; --bg2: #0b2416; --bg3: #030a06;
}
* { box-sizing: border-box; }
html, body { width:100%; height:100%; margin:0; overflow:hidden; background:#000; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; color:var(--fg); }
#scene { position:relative; width:100%; height:100%; overflow:hidden; background: radial-gradient(ellipse at 50% 35%, var(--bg1), var(--bg2) 52%, var(--bg3) 100%); isolation:isolate; }
canvas.bg { position:absolute; inset:0; width:100%; height:100%; }
.vignette { position:absolute; inset:0; background: radial-gradient(circle at center, transparent 42%, rgba(0,0,0,.10) 72%, rgba(0,0,0,.40) 100%); pointer-events:none; }
.clock-wrap { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); display:flex; flex-direction:column; align-items:center; gap:min(1.35vh, 12px); width:min(78vw, 760px); }
.clock-face { width:min(41vw, 420px); height:min(41vw, 420px); min-width:240px; min-height:240px; max-width:420px; max-height:420px; }
.ticks line.major { stroke: color-mix(in oklab, var(--fg) 88%, var(--accent)); stroke-width:2.1; opacity:.8; }
.ticks line.minor { stroke: color-mix(in oklab, var(--fg) 55%, transparent); stroke-width:1; opacity:.25; }
.ring-outer { fill:none; stroke: color-mix(in oklab, var(--ring) 88%, white 8%); stroke-width:2.6; opacity:.88; filter: drop-shadow(0 0 10px var(--glow)); }
.ring-inner { fill:none; stroke: color-mix(in oklab, var(--ring) 74%, transparent); stroke-width:1.2; opacity:.32; }
.hand-glow { stroke-linecap:round; filter: blur(4px); opacity:.24; }
.hand { stroke-linecap:round; }
.center-pin { fill: color-mix(in oklab, var(--fg) 95%, white); filter: drop-shadow(0 0 8px var(--glow)); }
.readout { text-align:center; white-space:nowrap; font-variant-numeric: tabular-nums; text-shadow:0 0 12px color-mix(in oklab, var(--glow) 60%, transparent); }
.day { font-size: clamp(11px, 1.1vw, 14px); letter-spacing:.45em; text-transform:uppercase; color: color-mix(in oklab, var(--muted) 90%, white 8%); }
.rule { width:min(26vw, 220px); height:1px; background:linear-gradient(90deg, transparent, color-mix(in oklab, var(--accent) 78%, white 12%), transparent); opacity:.65; box-shadow:0 0 12px color-mix(in oklab, var(--glow) 50%, transparent); }
.date { font-size: clamp(12px, 1.2vw, 16px); letter-spacing:.16em; text-transform:uppercase; color: var(--muted); opacity:.95; }
.time { display:inline-flex; align-items:flex-end; justify-content:center; position:relative; font-size: clamp(30px, 4.5vw, 64px); font-weight:260; letter-spacing:.08em; color: color-mix(in oklab, var(--fg) 95%, white 5%); text-shadow:0 0 16px color-mix(in oklab, var(--glow) 72%, transparent); line-height:1; }
.time-num { display:inline-block; }
.ampm { position:absolute; left:100%; bottom:.18em; transform:translateX(.38em); font-size:.34em; letter-spacing:.18em; color: var(--muted); }
.label { position:absolute; bottom:min(3.2vh,24px); left:50%; transform:translateX(-50%); font-size:11px; letter-spacing:.28em; text-transform:uppercase; color: color-mix(in oklab, var(--muted) 90%, white 5%); opacity:.72; white-space:nowrap; }
</style>
</head>
<body>
<div id="scene">
  <canvas id="bg" class="bg"></canvas>
  <div class="clock-wrap">
    <svg class="clock-face" viewBox="0 0 320 320" aria-hidden="true">
      <circle cx="160" cy="160" r="145" class="ring-outer" />
      <circle cx="160" cy="160" r="121" class="ring-inner" />
      <g id="ticks" class="ticks"></g>
      <g id="hour"><line class="hand-glow" x1="160" y1="172" x2="160" y2="96" stroke="rgba(229,239,203,.75)" stroke-width="12"/><line class="hand" x1="160" y1="172" x2="160" y2="96" stroke="#fff6da" stroke-width="5.4"/></g>
      <g id="minute"><line class="hand-glow" x1="160" y1="178" x2="160" y2="58" stroke="rgba(183,233,176,.72)" stroke-width="8"/><line class="hand" x1="160" y1="178" x2="160" y2="58" stroke="#dff5dd" stroke-width="3.2"/></g>
      <g id="second"><line class="hand-glow" x1="160" y1="190" x2="160" y2="40" stroke="rgba(233,206,130,.7)" stroke-width="6"/><line class="hand" x1="160" y1="190" x2="160" y2="40" stroke="#f0cc82" stroke-width="1.8"/></g>
      <circle cx="160" cy="160" r="4.2" class="center-pin"/>
    </svg>
    <div class="readout">
      <div class="day" id="day">TUESDAY</div>
      <div class="rule"></div>
      <div class="date" id="date">NOVEMBER 17, 2026</div>
      <div class="time"><span class="time-num" id="timeNum">10:52:50</span><span class="ampm" id="ampm">AM</span></div>
    </div>
  </div>
  <div class="vignette"></div>
  <div class="label">Forest Canopy</div>
</div>
<script>
(() => {
  const ns='http://www.w3.org/2000/svg';
  const ticks=document.getElementById('ticks');
  for(let i=0;i<60;i++){
    const a=i*Math.PI/30, major=i%5===0;
    const r1=major?124:132, r2=major?143:140;
    const line=document.createElementNS(ns,'line');
    line.setAttribute('x1',160+Math.sin(a)*r1); line.setAttribute('y1',160-Math.cos(a)*r1);
    line.setAttribute('x2',160+Math.sin(a)*r2); line.setAttribute('y2',160-Math.cos(a)*r2);
    line.setAttribute('class', major ? 'major':'minor'); ticks.appendChild(line);
  }
  const H=document.getElementById('hour'), M=document.getElementById('minute'), S=document.getElementById('second');
  const dayEl=document.getElementById('day'), dateEl=document.getElementById('date');
  const timeNumEl=document.getElementById('timeNum'), ampmEl=document.getElementById('ampm');
  let lastSec=-1;
  function clockFrame(){
    const d=new Date();
    const s=d.getSeconds()+d.getMilliseconds()/1000;
    const m=d.getMinutes()+s/60;
    const h=(d.getHours()%12)+m/60;
    H.setAttribute('transform',`rotate(${h*30} 160 160)`);
    M.setAttribute('transform',`rotate(${m*6} 160 160)`);
    S.setAttribute('transform',`rotate(${s*6} 160 160)`);
    if(d.getSeconds()!==lastSec){
      lastSec=d.getSeconds();
      dayEl.textContent=new Intl.DateTimeFormat('en-US',{weekday:'long'}).format(d).toUpperCase();
      dateEl.textContent=new Intl.DateTimeFormat('en-US',{month:'long',day:'numeric',year:'numeric'}).format(d).toUpperCase();
      timeNumEl.textContent=`${d.getHours()%12||12}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;
      ampmEl.textContent=d.getHours()<12?'AM':'PM';
    }
    requestAnimationFrame(clockFrame);
  }
  clockFrame();
  const scene=document.getElementById('scene');
  const canvas=document.getElementById('bg');
  const ctx=canvas.getContext('2d');
  let w=0,h=0, dpr=1;
  function resize(){
    const r=scene.getBoundingClientRect();
    w=r.width; h=r.height;
    dpr=Math.min(window.devicePixelRatio||1,1.5);
    canvas.width=w*dpr; canvas.height=h*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
    if (typeof onResize === 'function') onResize();
  }
  window.addEventListener('resize', resize);
  
  let seeds=[], leafClusters=[], rays=[];
  function resetObjects(){
    seeds=[...Array(18)].map(()=>({x:Math.random()*w,y:Math.random()*h*.95,r:4+Math.random()*7,vy:.09+Math.random()*.16,drift:Math.random()*6.28,spin:(Math.random()-.5)*.012,ang:Math.random()*6.28}));
    leafClusters=[
      {x:w*.07, y:-h*.035, reach:h*.15, dir:1, p:.4, s:1.0},
      {x:w*.31, y:-h*.042, reach:h*.105, dir:-1, p:1.5, s:.78},
      {x:w*.69, y:-h*.055, reach:h*.12, dir:1, p:2.5, s:.84},
      {x:w*.92, y:-h*.028, reach:h*.19, dir:-1, p:4.2, s:1.15}
    ];
    rays=[...Array(7)].map(()=>newRay(Math.random()*11));
  }
  function newRay(offset=0){
    return { x:w*(.08+Math.random()*.72), width:55+Math.random()*90, tilt:-.18-Math.random()*.22,
      start:offset+Math.random()*12, dur:4.8+Math.random()*7.6, fade:1.7+Math.random()*2.7,
      alpha:.08+Math.random()*.10, drift:(Math.random()-.5)*w*.08, squish:.2+Math.random()*.55, p:Math.random()*6.28 };
  }
  let gust=0, gustTarget=0, nextGust=7, gustEnd=0;
  function maybeStartGust(t){ if(t>nextGust){ gustTarget=(Math.random()<.5?-1:1)*(.14+Math.random()*.42); gustEnd=t+4+Math.random()*5; nextGust=t+24+Math.random()*16; }}
  // A continuous, irregular canopy edge lives ABOVE the frame, with only its
  // lower leaves and a few longer boughs reaching into view. No floating sprigs.
  function drawCanopyEdge(t){
    const topDepth=Math.min(36,h*.038);
    ctx.save();
    ctx.beginPath();ctx.moveTo(0,-12);
    for(let x=0;x<=w+12;x+=7){
      const n = .46*Math.sin(x*.018)+.30*Math.sin(x*.047+1.7)+.24*Math.sin(x*.083+2.8);
      const slow=Math.sin(t*.25+x*.007)*.65+gust*1.8;
      ctx.lineTo(x,topDepth*(.64+.30*n)+slow);
    }
    ctx.lineTo(w+12,-16);ctx.closePath();
    ctx.fillStyle='rgba(14,38,20,.24)';ctx.fill();
    // overlapping, softly tinted leaf clusters attached to the upper border
    for(let i=0;i<90;i++){
      const x=(i+.4)/90*w;
      const y=5 + topDepth*(.36 + .22*Math.sin(i*1.72)+.15*Math.sin(i*.43)) + gust*1.3;
      const sway=gust*4+Math.sin(t*.23+i*.8)*1.1;
      const width=7+(i*17%11), height=3+(i*7%5);
      ctx.save();ctx.translate(x+sway,y);ctx.rotate(-.2+Math.sin(i*1.91)*.7+gust*.12);
      ctx.fillStyle=i%3?'rgba(40,83,41,.105)':'rgba(78,116,60,.085)';
      ctx.beginPath();ctx.ellipse(0,0,width,height,0,0,Math.PI*2);ctx.fill();ctx.restore();
    }
    ctx.restore();
  }
  function drawLeafCluster(c,t){
    const wind=gust*12 + Math.sin(t*.35+c.p)*2.0;
    const startX=c.x, startY=c.y;
    const endX=startX + c.dir*c.reach*.35 + wind*.65;
    const endY=startY+c.reach;
    // flexible bough: one anchored curve with a few tapered twigs
    ctx.save();
    ctx.strokeStyle='rgba(23,52,26,.28)';ctx.lineCap='round';ctx.lineWidth=3*c.s;
    ctx.beginPath();ctx.moveTo(startX,startY);
    ctx.bezierCurveTo(startX+wind*.2,startY+c.reach*.35,
      endX-c.dir*c.reach*.18+wind*.4,startY+c.reach*.65,endX,endY);
    ctx.stroke();
    const leaves=[];
    for(let i=0;i<8;i++){
      const u=(i+1)/9, inv=1-u;
      const px=inv**3*startX+3*inv*inv*u*(startX+wind*.2)+3*inv*u*u*(endX-c.dir*c.reach*.18+wind*.4)+u**3*endX;
      const py=inv**3*startY+3*inv*inv*u*(startY+c.reach*.35)+3*inv*u*u*(startY+c.reach*.65)+u**3*endY;
      const side=i%2?1:-1;
      const twigLen=(12+((i*7)%15))*c.s;
      const tx=px+side*twigLen+wind*.17;
      const ty=py+7*c.s;
      ctx.lineWidth=1.2*c.s; ctx.beginPath();ctx.moveTo(px,py);ctx.quadraticCurveTo(px+side*twigLen*.45,py+2*c.s,tx,ty);ctx.stroke();
      leaves.push([tx,ty,side,i]);
    }
    for(const [x,y,side,i] of leaves){
      const rot=side*.58+gust*.22+Math.sin(t*.4+c.p+i)*.05;
      ctx.save();ctx.translate(x,y);ctx.rotate(rot);
      ctx.fillStyle=i%2?'rgba(55,100,51,.17)':'rgba(69,111,58,.12)';
      ctx.beginPath();ctx.ellipse(side*5*c.s,0,11*c.s,4.7*c.s,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='rgba(31,72,35,.10)';ctx.beginPath();ctx.ellipse(-side*4*c.s,-3*c.s,8*c.s,3.5*c.s,-.22,0,Math.PI*2);ctx.fill();
      ctx.restore();
    }
    ctx.restore();
  }
  function draw(ts){
    const t=ts*0.001; maybeStartGust(t); gust += (((t<gustEnd)?gustTarget:0)-gust)*0.012;
    ctx.clearRect(0,0,w,h);
    const wash=ctx.createLinearGradient(0,0,0,h); wash.addColorStop(0,'rgba(247,225,157,.10)'); wash.addColorStop(.34,'rgba(156,205,124,.06)'); wash.addColorStop(1,'rgba(3,18,10,.18)'); ctx.fillStyle=wash; ctx.fillRect(0,0,w,h);
    // dynamic light shafts through leaves
    for (const r of rays){
      let local=t-r.start;
      if(local > r.dur+r.fade){ Object.assign(r,newRay(t)); local=0; }
      if(local<0) continue;
      const fadeIn=Math.min(1, local/r.fade), fadeOut=Math.min(1, Math.max(0,(r.dur+r.fade-local)/r.fade));
      const env=Math.min(fadeIn, fadeOut);
      const width=r.width*(.68 + .50*(.5+.5*Math.sin(local*1.22+r.p)) );
      const alpha=r.alpha*env;
      const x=r.x + r.drift*(.5+.5*Math.sin(local*.50+r.p));
      ctx.save();
      ctx.translate(x,-h*.18); ctx.rotate(r.tilt + Math.sin(local*.25+r.p)*.02);
      // The light is already fully transparent BEFORE the polygon ends. This removes
      // the hard lower edge without relying on CSS blur or canvas masking.
      const g=ctx.createLinearGradient(0,0,0,h*1.12);
      g.addColorStop(0,'rgba(255,248,218,0)');
      g.addColorStop(.13,`rgba(255,245,205,${alpha*0.95})`);
      g.addColorStop(.43,`rgba(255,241,188,${alpha*0.55})`);
      g.addColorStop(.76,`rgba(255,241,188,${alpha*0.12})`);
      g.addColorStop(.91,'rgba(255,241,188,0)');
      g.addColorStop(1,'rgba(255,241,188,0)');
      ctx.fillStyle=g; ctx.beginPath(); ctx.moveTo(-width/2,0); ctx.lineTo(width/2,0); ctx.lineTo(width*(.5+r.squish),h*1.12); ctx.lineTo(-width*(.5-r.squish*.15),h*1.12); ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    drawCanopyEdge(t);
    leafClusters.forEach(c=>drawLeafCluster(c,t));
    // soft distant blobs to keep depth calm
    for(let i=0;i<6;i++){ ctx.fillStyle='rgba(255,240,190,.025)'; ctx.beginPath(); ctx.arc((i+.5)/6*w + Math.sin(t*.1+i)*18, h*.17+Math.cos(i+t*.22)*16, 16+((i*7)%10),0,Math.PI*2); ctx.fill(); }
    for(const s of seeds){
      s.y += s.vy; s.x += gust*1.35 + Math.sin(t*.55+s.drift)*0.08; s.ang += s.spin + gust*.01;
      if(s.y>h+16 || s.x<-30 || s.x>w+30){ s.y=-12; s.x=Math.random()*w; s.vy=.09+Math.random()*.16; }
      ctx.save(); ctx.translate(s.x,s.y); ctx.rotate(Math.sin(t+s.ang)*0.7 + gust*.16);
      ctx.strokeStyle='rgba(243,232,187,.18)'; ctx.lineWidth=.9; ctx.beginPath(); ctx.moveTo(-s.r*.85,0); ctx.lineTo(s.r*.9,0); ctx.stroke();
      ctx.fillStyle='hsla(84,32%,78%,0.10)'; ctx.beginPath(); ctx.ellipse(0,0,s.r,s.r*.42,0,0,Math.PI*2); ctx.fill();
      ctx.restore();
    }
    requestAnimationFrame(draw);
  }
  function onResize(){ resetObjects(); }
  requestAnimationFrame(draw);

  resize();
})();
</script>
</body></html>
