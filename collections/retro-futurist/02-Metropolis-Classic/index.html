<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Metropolis — Deco Time Authority • Symmetry Edition</title><style>
:root{color-scheme:dark;--gold:#dcb878;--brass:#9a7746;--pale:#f3e4bb;--coal:#091116;--amber:#ffcb77}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#05090d;color:var(--pale)}
body{font-family:Georgia,"Times New Roman",serif;-webkit-font-smoothing:antialiased}
.scene{position:relative;min-height:100%;height:100dvh;display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(ellipse at 50% 53%,#223036 0%,#10191e 50%,#05090d 90%)}
.scene:before{content:"";position:absolute;inset:0;opacity:.11;background:repeating-linear-gradient(90deg,transparent 0 28px,#cbb27f 29px,transparent 30px),repeating-linear-gradient(0deg,transparent 0 28px,#cbb27f 29px,transparent 30px);mask-image:radial-gradient(ellipse,#0002,transparent 75%)}
.scene:after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.18;background:linear-gradient(transparent 49%,#0008 50%,transparent 51%);background-size:100% 4px}
.console{width:min(96vw,1460px);height:min(94vh,845px);min-height:480px;position:relative;padding:clamp(12px,2vw,30px);border:2px solid #87643e;outline:1px solid #d4ac68;outline-offset:-11px;background:radial-gradient(ellipse at 50% 45%,#1d2a2d 0%,#10191d 50%,#081013 92%);box-shadow:inset 0 0 0 6px #0a1215,inset 0 0 60px #030708,0 0 60px #000;display:flex;flex-direction:column;align-items:center;justify-content:space-between}
.corner{position:absolute;width:88px;height:88px;opacity:.8;border:2px solid var(--gold);z-index:2}.tl{top:16px;left:16px;border-right:0;border-bottom:0}.tr{top:16px;right:16px;border-left:0;border-bottom:0}.bl{bottom:16px;left:16px;border-right:0;border-top:0}.br{bottom:16px;right:16px;border-left:0;border-top:0}
.top{position:relative;z-index:1;text-align:center;width:100%;margin-top:4px}.eyebrow{font-family:"Trebuchet MS",sans-serif;font-size:clamp(9px,.8vw,13px);letter-spacing:.48em;color:#b89b71}.brand{font-family:Georgia,serif;font-size:clamp(27px,3.5vw,56px);letter-spacing:.24em;margin-right:-.24em;line-height:1.16;color:#eedbb0;text-shadow:0 0 18px #ffce8040;font-weight:normal}.subline{font-family:Arial,sans-serif;letter-spacing:.31em;font-size:clamp(9px,.75vw,12px);color:#ae8b5e;margin-top:6px}.deco-rule{margin:13px auto 0;width:min(60%,680px);height:13px;background:linear-gradient(90deg,transparent 0%,#856238 22%,#ead09a 50%,#856238 78%,transparent 100%);clip-path:polygon(0 46%,42% 46%,46% 0,54% 0,58% 46%,100% 46%,100% 56%,58% 56%,54% 100%,46% 100%,42% 56%,0 56%);opacity:.84}
.body{width:min(95%,1170px);flex:1;min-height:0;display:grid;grid-template-columns:1fr minmax(250px,1.85fr) 1fr;align-items:center;gap:clamp(8px,2vw,38px)}
.wing{height:82%;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:space-around;gap:10px;border-top:1px solid #9774495c;border-bottom:1px solid #9774495c;padding:15px 8px;background:linear-gradient(90deg,transparent,#ffffff04,transparent)}
.wing-head{font-family:Arial,sans-serif;font-size:clamp(9px,.85vw,12px);letter-spacing:.26em;color:#b89a6b;text-align:center}
.gauge{width:min(100%,200px);aspect-ratio:1;filter:drop-shadow(0 0 14px #d4a34a12)}.gauge .glass{fill:#0b1719;stroke:#a37d45;stroke-width:2}.gauge .arcm{stroke:#6c5335;stroke-width:1;fill:none}.gauge .needle{stroke:#f0cb88;stroke-width:3;stroke-linecap:round;filter:drop-shadow(0 0 4px #ffc36988)}
.status{font-family:Arial,sans-serif;text-align:center;letter-spacing:.21em;font-size:clamp(9px,.9vw,12px);color:#8f9d8e}.led{display:inline-block;height:7px;width:7px;background:#edc47d;border-radius:100%;box-shadow:0 0 8px #ffbb66;animation:pulse 5s ease-in-out infinite alternate;margin-right:9px}@keyframes pulse{to{opacity:.35}}
.rays{width:76%;height:34px;opacity:.72;display:flex;justify-content:space-between;align-items:center;background:none;clip-path:none;padding:0 7px}.rays i{display:block;width:1px;height:14px;background:#c0a06b;box-shadow:0 0 5px #e4b97d25}.rays i:nth-child(2),.rays i:nth-child(4){height:22px}.rays i:nth-child(3){height:30px}
.dial-shell{position:relative;aspect-ratio:1;width:min(100%,min(46vh,485px));margin:auto;border-radius:50%;border:3px solid #e1bc75;background:radial-gradient(circle,#17272a 0%,#0a1519 69%,#25312f 70%,#121c1d 72%);box-shadow:inset 0 0 0 7px #1b2625,inset 0 0 0 11px #9d763e,inset 0 0 0 13px #0e1616,inset 0 0 60px #000c,0 0 0 6px #131c1c,0 0 0 8px #705631,0 0 32px #dca75d15}
.dial-shell:before{content:"";position:absolute;inset:9%;border-radius:50%;border:1px solid #c9a26961;pointer-events:none}.dial-shell:after{content:"";position:absolute;inset:17%;border-radius:50%;border:1px solid #c9a26916;pointer-events:none}
.dial{width:100%;height:100%}.dial .tick{stroke:#bda171;stroke-linecap:square}.dial .hour-hand{stroke:#f3dca7;stroke-width:5;stroke-linecap:round;filter:drop-shadow(0 0 4px #f3c67966)}.dial .minute-hand{stroke:#e4d6b0;stroke-width:3;stroke-linecap:round;filter:drop-shadow(0 0 3px #f3c67966)}.dial .second-hand{stroke:#dc8c53;stroke-width:1.6;stroke-linecap:round}.dial .cap{fill:#f9e4ac;stroke:#8d6235;stroke-width:3}
.clock-word{position:absolute;top:28%;left:0;width:100%;text-align:center;font-family:Arial,sans-serif;letter-spacing:.4em;font-size:clamp(7px,.7vw,11px);color:#8c967f}
.footer{width:min(76%,760px);display:flex;align-items:center;flex-direction:column;gap:9px;margin:0 0 2.5%;z-index:1}.plaque{width:100%;padding:10px 22px;text-align:center;border:1px solid #987748;background:linear-gradient(90deg,#0b1416,#202d2b 49%,#0b1416);box-shadow:inset 0 0 0 3px #0d1719,0 0 20px #ba874414}
.weekday{font-family:Arial,sans-serif;font-size:clamp(9px,.8vw,12px);letter-spacing:.44em;color:#c8ad7b}.time{font-family:Georgia,serif;font-size:clamp(25px,3.1vw,48px);letter-spacing:.12em;color:#ffe5b2;font-variant-numeric:tabular-nums;text-shadow:0 0 14px #eebd6745}.date{font-family:Arial,sans-serif;font-size:clamp(9px,.85vw,12px);letter-spacing:.27em;color:#b59970}.bottom-caption{font-family:Arial,sans-serif;font-size:clamp(8px,.72vw,11px);letter-spacing:.4em;color:#8d6c45;text-align:center}
@media(max-width:750px){.console{height:97vh;padding:12px}.body{grid-template-columns:1fr;justify-items:center}.wing{display:none}.dial-shell{width:min(68vw,46vh)}.top .brand{font-size:24px}.footer{width:95%;margin-bottom:10px}.corner{width:40px;height:40px}.bottom-caption{font-size:8px}}
</style></head><body><main class="scene"><section class="console">
<i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
<header class="top"><div class="eyebrow">THE CIVIC CLOCKWORK AUTHORITY</div><div class="brand">METROPOLIS</div><div class="subline">ELECTRO-MECHANICAL TIME STANDARD • EST. 1947</div><div class="deco-rule"></div></header>
<section class="body">
<div class="wing"><div class="wing-head">REGULATOR / 01</div>
<svg class="gauge" viewBox="0 0 160 160"><circle cx="80" cy="80" r="73" class="glass"/><circle cx="80" cy="80" r="60" class="arcm"/><path d="M32 114 A60 60 0 1 1 128 114" fill="none" stroke="#b08a4b" stroke-width="3"/><g id="gaugeTicks1"></g><g id="needle1"><path d="M80 92 L80 38" class="needle"/></g><circle cx="80" cy="80" r="5" fill="#eed3a1"/><text x="80" y="113" text-anchor="middle" fill="#bea16f" font-size="8" font-family="Arial" letter-spacing="2">FREQUENCY</text></svg>
<div class="status"><span class="led"></span>POWER STABLE</div><div class="rays" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
</div>
<div class="dial-shell"><span class="clock-word">OFFICIAL LOCAL TIME</span><svg class="dial" viewBox="0 0 320 320"><g id="ticks"></g><g id="numbers"></g><g id="hhand"><path d="M160 174 L160 93" class="hour-hand"/></g><g id="mhand"><path d="M160 177 L160 49" class="minute-hand"/></g><g id="shand"><path d="M160 196 L160 38" class="second-hand"/></g><circle cx="160" cy="160" r="6" class="cap"/></svg></div>
<div class="wing"><div class="wing-head">VACUUM DRIVE / 02</div>
<svg class="gauge" viewBox="0 0 160 160"><circle cx="80" cy="80" r="73" class="glass"/><circle cx="80" cy="80" r="60" class="arcm"/><path d="M32 114 A60 60 0 1 1 128 114" fill="none" stroke="#b08a4b" stroke-width="3"/><g id="gaugeTicks2"></g><g id="needle2"><path d="M80 92 L80 38" class="needle"/></g><circle cx="80" cy="80" r="5" fill="#eed3a1"/><text x="80" y="113" text-anchor="middle" fill="#bea16f" font-size="8" font-family="Arial" letter-spacing="2">PRESSURE</text></svg>
<div class="status"><span class="led" style="animation-delay:2s"></span>SYNC ACTIVE</div><div class="rays" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div></div>
</section>
<footer class="footer"><div class="plaque"><div id="weekday" class="weekday">TUESDAY</div><div id="time" class="time">10:52:50</div><div id="date" class="date">NOVEMBER 17, 2026</div></div><div class="bottom-caption">PRECISION • ORDER • A BRIGHTER TOMORROW</div></footer>
</section></main>
<script>
(()=>{const ns='http://www.w3.org/2000/svg';function line(parent,x1,y1,x2,y2,width,color){const e=document.createElementNS(ns,'line');for(const [k,v] of Object.entries({x1,y1,x2,y2,'stroke-width':width,stroke:color}))e.setAttribute(k,v);parent.append(e)}
const ticks=document.querySelector('#ticks');for(let i=0;i<60;i++){let a=i*Math.PI/30,k=i%5===0;let ri=k?130:138,ro=146;line(ticks,160+Math.sin(a)*ri,160-Math.cos(a)*ri,160+Math.sin(a)*ro,160-Math.cos(a)*ro,k?2:1,k?'#e8c58c':'#806849')}
const nums=document.querySelector('#numbers');for(let i=0;i<12;i++){const a=(i+1)*Math.PI/6;const e=document.createElementNS(ns,'text');e.setAttribute('x',160+Math.sin(a)*110);e.setAttribute('y',160-Math.cos(a)*110+5);e.setAttribute('fill','#e1c696');e.setAttribute('text-anchor','middle');e.setAttribute('font-family','Georgia');e.setAttribute('font-size','16');e.textContent=['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII'][i];nums.append(e)}
for(let id of ['gaugeTicks1','gaugeTicks2']){let g=document.getElementById(id);for(let i=0;i<11;i++){let a=(-120+i*24)*Math.PI/180;line(g,80+Math.sin(a)*50,80-Math.cos(a)*50,80+Math.sin(a)*57,80-Math.cos(a)*57,1.2,'#91754b')}}
const h=document.getElementById('hhand'),m=document.getElementById('mhand'),s=document.getElementById('shand'),g1=document.getElementById('needle1'),g2=document.getElementById('needle2');const wd=document.getElementById('weekday'),date=document.getElementById('date'),time=document.getElementById('time');let last=-1;
function tick(t){const d=new Date(),secs=d.getSeconds()+d.getMilliseconds()/1000,mins=d.getMinutes()+secs/60,hrs=d.getHours()%12+mins/60;h.setAttribute('transform',`rotate(${hrs*30} 160 160)`);m.setAttribute('transform',`rotate(${mins*6} 160 160)`);s.setAttribute('transform',`rotate(${secs*6} 160 160)`);g1.setAttribute('transform',`rotate(${Math.sin(t/2500)*40} 80 80)`);g2.setAttribute('transform',`rotate(${Math.sin(t/4400+1)*54} 80 80)`);if(d.getSeconds()!==last){last=d.getSeconds();wd.textContent=new Intl.DateTimeFormat('en-US',{weekday:'long'}).format(d).toUpperCase();date.textContent=new Intl.DateTimeFormat('en-US',{month:'long',day:'numeric',year:'numeric'}).format(d).toUpperCase();time.textContent=new Intl.DateTimeFormat('en-US',{hour:'numeric',minute:'2-digit',second:'2-digit',hour12:true}).format(d)}requestAnimationFrame(tick)}requestAnimationFrame(tick)})();
</script></body></html>
