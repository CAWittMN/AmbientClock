<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ocean Tide — Lighthouse Perspective & Boat V16</title>
<style>
:root {
  --fg: #eef9ff; --muted: #b0d8e9; --accent: #9ad0ef; --accent2: #d9e5f4;
  --ring: #7eb6d3; --glow: rgba(109,192,235,.30); --bg1: #173a55; --bg2: #0b2238; --bg3: #03101d;
}
* { box-sizing: border-box; }
html, body { width:100%; height:100%; margin:0; overflow:hidden; background:#000; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; color:var(--fg); }
#scene { position:relative; width:100%; height:100%; overflow:hidden; background: radial-gradient(ellipse at 50% 35%, var(--bg1), var(--bg2) 52%, var(--bg3) 100%); isolation:isolate; }
canvas.bg { position:absolute; inset:0; width:100%; height:100%; }
.vignette { position:absolute; inset:0; background: radial-gradient(circle at center, transparent 42%, rgba(0,0,0,.10) 72%, rgba(0,0,0,.40) 100%); pointer-events:none; }
.clock-wrap { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); display:flex; flex-direction:column; align-items:center; gap:min(1.35vh, 12px); width:min(78vw, 760px); }
.clock-face { width:min(41vw, 420px); height:min(41vw, 420px); min-width:240px; min-height:240px; max-width:420px; max-height:420px; }
.ticks line.major { stroke: color-mix(in oklab, var(--fg) 88%, var(--accent)); stroke-width:2.1; opacity:.8; }
.ticks line.minor { stroke: color-mix(in oklab, var(--fg) 55%, transparent); stroke-width:1; opacity:.25; }
.ring-outer { fill:none; stroke: color-mix(in oklab, var(--ring) 88%, white 8%); stroke-width:2.6; opacity:.88; filter: drop-shadow(0 0 10px var(--glow)); }
.ring-inner { fill:none; stroke: color-mix(in oklab, var(--ring) 74%, transparent); stroke-width:1.2; opacity:.32; }
.hand-glow { stroke-linecap:round; filter: blur(4px); opacity:.24; }
.hand { stroke-linecap:round; }
.center-pin { fill: color-mix(in oklab, var(--fg) 95%, white); filter: drop-shadow(0 0 8px var(--glow)); }
.readout { text-align:center; white-space:nowrap; font-variant-numeric: tabular-nums; text-shadow:0 0 12px color-mix(in oklab, var(--glow) 60%, transparent); }
.day { font-size: clamp(11px, 1.1vw, 14px); letter-spacing:.45em; text-transform:uppercase; color: color-mix(in oklab, var(--muted) 90%, white 8%); }
.rule { width:min(26vw, 220px); height:1px; background:linear-gradient(90deg, transparent, color-mix(in oklab, var(--accent) 78%, white 12%), transparent); opacity:.65; box-shadow:0 0 12px color-mix(in oklab, var(--glow) 50%, transparent); }
.date { font-size: clamp(12px, 1.2vw, 16px); letter-spacing:.16em; text-transform:uppercase; color: var(--muted); opacity:.95; }
.time { display:inline-flex; align-items:flex-end; justify-content:center; position:relative; font-size: clamp(30px, 4.5vw, 64px); font-weight:260; letter-spacing:.08em; color: color-mix(in oklab, var(--fg) 95%, white 5%); text-shadow:0 0 16px color-mix(in oklab, var(--glow) 72%, transparent); line-height:1; }
.time-num { display:inline-block; }
.ampm { position:absolute; left:100%; bottom:.18em; transform:translateX(.38em); font-size:.34em; letter-spacing:.18em; color: var(--muted); }
.label { position:absolute; bottom:min(3.2vh,24px); left:50%; transform:translateX(-50%); font-size:11px; letter-spacing:.28em; text-transform:uppercase; color: color-mix(in oklab, var(--muted) 90%, white 5%); opacity:.72; white-space:nowrap; }
</style>
</head>
<body>
<div id="scene">
  <canvas id="bg" class="bg"></canvas>
  <div class="clock-wrap">
    <svg class="clock-face" viewBox="0 0 320 320" aria-hidden="true">
      <circle cx="160" cy="160" r="145" class="ring-outer" />
      <circle cx="160" cy="160" r="121" class="ring-inner" />
      <g id="ticks" class="ticks"></g>
      <g id="hour"><line class="hand-glow" x1="160" y1="172" x2="160" y2="96" stroke="rgba(231,241,255,.70)" stroke-width="12"/><line class="hand" x1="160" y1="172" x2="160" y2="96" stroke="#f9fdff" stroke-width="5.4"/></g>
      <g id="minute"><line class="hand-glow" x1="160" y1="178" x2="160" y2="58" stroke="rgba(173,224,244,.76)" stroke-width="8"/><line class="hand" x1="160" y1="178" x2="160" y2="58" stroke="#d6f4ff" stroke-width="3.2"/></g>
      <g id="second"><line class="hand-glow" x1="160" y1="190" x2="160" y2="40" stroke="rgba(140,189,234,.75)" stroke-width="6"/><line class="hand" x1="160" y1="190" x2="160" y2="40" stroke="#9ed2ff" stroke-width="1.8"/></g>
      <circle cx="160" cy="160" r="4.2" class="center-pin"/>
    </svg>
    <div class="readout">
      <div class="day" id="day">TUESDAY</div>
      <div class="rule"></div>
      <div class="date" id="date">NOVEMBER 17, 2026</div>
      <div class="time"><span class="time-num" id="timeNum">10:52:50</span><span class="ampm" id="ampm">AM</span></div>
    </div>
  </div>
  <div class="vignette"></div>
  <div class="label">Ocean Tide</div>
</div>
<script>
(() => {
  const ns='http://www.w3.org/2000/svg';
  const ticks=document.getElementById('ticks');
  for(let i=0;i<60;i++){
    const a=i*Math.PI/30, major=i%5===0;
    const r1=major?124:132, r2=major?143:140;
    const line=document.createElementNS(ns,'line');
    line.setAttribute('x1',160+Math.sin(a)*r1); line.setAttribute('y1',160-Math.cos(a)*r1);
    line.setAttribute('x2',160+Math.sin(a)*r2); line.setAttribute('y2',160-Math.cos(a)*r2);
    line.setAttribute('class', major ? 'major':'minor'); ticks.appendChild(line);
  }
  const H=document.getElementById('hour'), M=document.getElementById('minute'), S=document.getElementById('second');
  const dayEl=document.getElementById('day'), dateEl=document.getElementById('date');
  const timeNumEl=document.getElementById('timeNum'), ampmEl=document.getElementById('ampm');
  let lastSec=-1;
  function clockFrame(){
    const d=new Date();
    const s=d.getSeconds()+d.getMilliseconds()/1000;
    const m=d.getMinutes()+s/60;
    const h=(d.getHours()%12)+m/60;
    H.setAttribute('transform',`rotate(${h*30} 160 160)`);
    M.setAttribute('transform',`rotate(${m*6} 160 160)`);
    S.setAttribute('transform',`rotate(${s*6} 160 160)`);
    if(d.getSeconds()!==lastSec){
      lastSec=d.getSeconds();
      dayEl.textContent=new Intl.DateTimeFormat('en-US',{weekday:'long'}).format(d).toUpperCase();
      dateEl.textContent=new Intl.DateTimeFormat('en-US',{month:'long',day:'numeric',year:'numeric'}).format(d).toUpperCase();
      timeNumEl.textContent=`${d.getHours()%12||12}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;
      ampmEl.textContent=d.getHours()<12?'AM':'PM';
    }
    requestAnimationFrame(clockFrame);
  }
  clockFrame();
  const scene=document.getElementById('scene');
  const canvas=document.getElementById('bg');
  const ctx=canvas.getContext('2d');
  let w=0,h=0, dpr=1;
  function resize(){
    const r=scene.getBoundingClientRect();
    w=r.width; h=r.height;
    dpr=Math.min(window.devicePixelRatio||1,1.5);
    canvas.width=w*dpr; canvas.height=h*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
    if (typeof onResize === 'function') onResize();
  }
  window.addEventListener('resize', resize);
  
  let time=0;
  const TWO=Math.PI*2;
  const smoothstep=(a,b,x)=>{const q=Math.max(0,Math.min(1,(x-a)/(b-a)));return q*q*(3-2*q)};
  function waveHeight(x,y,amp,len,speed){
    return y + Math.sin(x/len+time*speed)*amp + Math.sin(x/(len*.48)+time*speed*.8)*amp*.2;
  }
  function wavePath(y,amp,len,speed){const pts=[];for(let x=-10;x<=w+10;x+=6)pts.push([x,waveHeight(x,y,amp,len,speed)]);return pts;}
  function strokeWave(pts,color,width){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke();}
  function fillWave(pts,color){ctx.beginPath();ctx.moveTo(pts[0][0],h);pts.forEach(p=>ctx.lineTo(p[0],p[1]));ctx.lineTo(pts[pts.length-1][0],h);ctx.closePath();ctx.fillStyle=color;ctx.fill();}
  const BEACON_OMEGA=.295; // radians/second, one rotation in ~21.3s
  // An orthographic view of a horizontal revolving beacon, with exaggerated
  // perspective cues. The 2D tip follows sin(phase) continuously; it never
  // flips sign abruptly at front/back orientation.
  // Lighthouse V15. One continuous rotation phase drives all light components.
  // For preview/testing only: append ?beamPhase=0 (toward), 1.5708 (right),
  // 3.14159 (away), or 4.71239 (left). Normal wallpaper has no override.
  const previewBeamPhase = new URLSearchParams(window.location.search).get('beamPhase');
  function drawBeam(lx,ly,t){
    const phase = previewBeamPhase === null ? t*BEACON_OMEGA : Number(previewBeamPhase);
    const side = Math.sin(phase);
    const sideMagnitude = Math.abs(side);
    const facing = Math.max(0, Math.cos(phase));
    const away = Math.max(0, -Math.cos(phase));
    // Use a SIGNED projected length. This removes direction flips at both 0 and PI:
    // as the lighthouse turns head-on, the side-reaching cone smoothly collapses
    // into the radial front glow, then emerges on the opposite side.
    const mainX = side * w * .70;
    const hazeX = side * w * .78;
    const baseWidth = Math.max(1.2, Math.min(2.2, h*.0024)); // physically small lantern
    const rearness = 1 - .80*away;
    // Cone widens outward (NOT toward source). Away half gets narrower.
    const widthFactor = Math.max(.30, sideMagnitude * (1 - .60*away));
    const mainHalf = 7 + h*.098*widthFactor + h*.028*facing;
    const hazeHalf = 11 + h*.145*widthFactor + h*.038*facing;
    // Strong frontward brightening already begins while the cone is still visible.
    const mainPower = (0.18 + 0.58*Math.pow(facing,.90)) * rearness;
    const hazePower = (0.11 + 0.27*facing + .03*away) * (1 - .55*away);

    // Drawing a tapered geometry with a transparent far end avoids hard tips.
    // Canvas blur is layered for atmospheric feathered edges; neither cone has
    // a wide source base or a second independently rotating orientation.
    function paintCone(x, endHalf, sourceHalf, power, blur){
      if(Math.abs(x) < 1) return;  // exactly head-on: the circular light takes over
      const direction = Math.sign(x);
      ctx.save();
      if(blur) ctx.filter = `blur(${blur}px)`;
      const grad = ctx.createLinearGradient(lx,ly,lx+x,ly);
      grad.addColorStop(0, `rgba(255,249,224,${(power*.96).toFixed(4)})`);
      grad.addColorStop(.18, `rgba(255,244,207,${(power*.82).toFixed(4)})`);
      grad.addColorStop(.50, `rgba(255,239,193,${(power*.42).toFixed(4)})`);
      grad.addColorStop(.78, `rgba(255,236,187,${(power*.10).toFixed(4)})`);
      grad.addColorStop(1, 'rgba(255,232,180,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(lx,ly-sourceHalf);
      // Open out continuously — no pinched oval sides, hard polygon cap, or step.
      ctx.bezierCurveTo(lx+x*.22,ly-(sourceHalf+(endHalf-sourceHalf)*.20),
                        lx+x*.76,ly-(sourceHalf+(endHalf-sourceHalf)*.76),
                        lx+x,ly-endHalf);
      ctx.lineTo(lx+x+direction*2, ly);
      ctx.lineTo(lx+x,ly+endHalf);
      ctx.bezierCurveTo(lx+x*.76,ly+(sourceHalf+(endHalf-sourceHalf)*.76),
                        lx+x*.22,ly+(sourceHalf+(endHalf-sourceHalf)*.20),
                        lx,ly+sourceHalf);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    // Diffuse and core use the same phase (no lag). Soft haze is drawn FIRST.
    paintCone(hazeX, hazeHalf*1.30, baseWidth*1.20, hazePower*.45, 19);
    paintCone(hazeX, hazeHalf, baseWidth*1.12, hazePower*.50, 9);
    paintCone(mainX, mainHalf*1.11, baseWidth*.75, mainPower*.44, 6);
    paintCone(mainX, mainHalf, baseWidth*.65, mainPower*.62, 1.5);

    // A small round glow remains when the light is pointing away. It is not
    // allowed to stretch into an oval under any rotation state.
    function roundGlow(radius, stops){
      const grad=ctx.createRadialGradient(lx,ly,0,lx,ly,radius);
      for(const [at,alpha] of stops) grad.addColorStop(at,`rgba(255,245,213,${Math.min(.999,Math.max(0,alpha)).toFixed(4)})`);
      ctx.fillStyle=grad; ctx.beginPath(); ctx.arc(lx,ly,radius,0,TWO); ctx.fill();
    }

    // This broad, CIRCULAR bloom is intentionally ABOVE the main beam. As the
    // cone projects to zero horizontal reach it completely hides the degenerate
    // shape. Its brightness & diameter peak together in the toward-us pass.
    const haloR = 26 + 43*facing + 18*away;
    roundGlow(haloR, [[0,.10+.62*facing+.11*away],
                      [.25,.055+.42*facing+.07*away],
                      [.65,.012+.15*facing+.028*away], [1,0]]);
    // Both extra forward-facing bloom layers start at EXACTLY zero opacity.
    // Previously their base alphas were nonzero inside `if(facing>0)`, which
    // caused a visible pop when cos(phase) crossed zero at either side.
    // Smoothstep makes the new fade continuous and gentle at both endpoints.
    const forwardFade = facing*facing*(3-2*facing);
    // Larger faint atmosphere surrounding the circular bright core.
    roundGlow(haloR + 35*facing, [
      [0, (.10+.30*facing)*forwardFade],
      [.30, (.05+.22*facing)*forwardFade],
      [.70, (.04*facing)*forwardFade],
      [1, 0]
    ]);
    // Focused light wash peaks during the directly forward-facing pass.
    roundGlow(15+31*facing, [
      [0, (.25+.70*facing)*forwardFade],
      [.30, (.12+.54*facing)*forwardFade],
      [.70, (.03+.16*facing)*forwardFade],
      [1, 0]
    ]);
    // Only the actual source is this tiny (a few pixels). Ambient light around
    // it can be large without suggesting the physical lighthouse is large.
    roundGlow(5.5,[[0,.38+.50*facing], [.45,.18+.37*facing], [1,0]]);
  }
  // The small boat is anchored to precisely the same function as the third wave's vertices.
  // Wave slope also tilts the hull, preventing the 'independent bobbing' look.
  function drawBoat(){
    const x=w*.23 + 14*Math.sin(time*.065), centerY=h*.69;
    const y=waveHeight(x,centerY,11,74,.91);
    const slope=(waveHeight(x+8,centerY,11,74,.91)-waveHeight(x-8,centerY,11,74,.91))/16;
    const scale=Math.max(.72,Math.min(1.25,w/1500));
    ctx.save();ctx.translate(x,y-1);ctx.rotate(Math.atan(slope)*.78);ctx.scale(scale,scale);
    // Thin hull glides over the wave with small bow and stern curves.
    ctx.fillStyle='rgba(4,16,27,.92)';ctx.beginPath();
    ctx.moveTo(-32,-4);ctx.quadraticCurveTo(-19,0,26,-4);ctx.lineTo(19,7);
    ctx.quadraticCurveTo(2,12,-21,6);ctx.closePath();ctx.fill();
    ctx.strokeStyle='rgba(172,216,233,.52)';ctx.lineWidth=1.2;ctx.beginPath();
    ctx.moveTo(-32,-4);ctx.quadraticCurveTo(-12,-1,26,-4);ctx.stroke();
    // A restrained single sail and a fine mast silhouette.
    ctx.strokeStyle='rgba(161,211,229,.6)';ctx.lineWidth=1.1;
    ctx.beginPath();ctx.moveTo(-3,-5);ctx.lineTo(-3,-43);ctx.stroke();
    ctx.fillStyle='rgba(186,216,230,.19)';ctx.beginPath();
    ctx.moveTo(-5,-40);ctx.lineTo(-5,-10);ctx.lineTo(-25,-11);ctx.closePath();ctx.fill();
    ctx.fillStyle='rgba(200,228,237,.14)';ctx.beginPath();
    ctx.moveTo(-1,-34);ctx.lineTo(16,-10);ctx.lineTo(-1,-10);ctx.closePath();ctx.fill();
    ctx.strokeStyle='rgba(147,204,227,.26)';ctx.lineWidth=.8;ctx.beginPath();ctx.moveTo(-36,9);ctx.quadraticCurveTo(-43,12,-48,11);ctx.stroke();
    ctx.restore();
  }
  // As the beam turns toward us, the floating motes light up from the current sweep
  // side and then hold brighter near the fully toward-facing pass.
  function lightUpOpacity(x,t){
    const phase=((t*BEACON_OMEGA)%(TWO)+TWO)%TWO;
    const horiz=Math.sin(phase);
    const toward=Math.max(0, Math.cos(phase));
    const sideDir=horiz>=0?1:-1;
    const progress=sideDir>0 ? (1 - x/w) : (x/w); // brighten from beam side inward
    const sweepWindow=smoothstep(0.15,0.95,Math.max(0, sideDir>0 ? horiz : -horiz));
    const traveling=smoothstep(progress-0.16, progress+0.08, sweepWindow);
    const hold=toward;
    return 1 + 0.55*traveling + 1.10*hold;
  }
  const motes=Array.from({length:13},(_,i)=>({u:(i+.4)/13,r:10+(i*7)%10,a:.032+((i*3)%5)*.004,phase:i*.82}));
  function drawMotes(t){
    for(const m of motes){
      const x=m.u*w+Math.sin(t*.24+m.phase)*12;
      const y=h*.165+Math.cos(m.phase+t*.42)*16;
      const mult=lightUpOpacity(x,t);
      ctx.fillStyle=`rgba(216,237,246,${(m.a*mult).toFixed(4)})`;
      ctx.beginPath();ctx.arc(x,y,m.r,0,TWO);ctx.fill();
    }
  }
  function draw(ts){
    time=ts*.001;ctx.clearRect(0,0,w,h);
    const moonX=w*.22,moonY=h*.18;
    ctx.fillStyle='rgba(255,245,220,.13)';ctx.beginPath();ctx.arc(moonX,moonY,34,0,TWO);ctx.fill();
    const wave1=wavePath(h*.57,7,52,.75),wave2=wavePath(h*.63,9,63,.83),
          wave3=wavePath(h*.69,11,74,.91),wave4=wavePath(h*.76,13,86,.98),wave5=wavePath(h*.84,16,98,1.05);
    // Distant island, intentionally muted and vertically faded so the wave overlap feels softer.
    const islandTop=h*.535, islandBottom=h*.603;
    const islandGrad=ctx.createLinearGradient(0,islandTop,0,islandBottom);
    islandGrad.addColorStop(0,'rgba(13,22,31,.34)');
    islandGrad.addColorStop(.72,'rgba(13,22,31,.22)');
    islandGrad.addColorStop(1,'rgba(13,22,31,0)');
    ctx.fillStyle=islandGrad;ctx.beginPath();
    ctx.moveTo(w*.74,h*.57);ctx.lineTo(w*.80,h*.545);ctx.lineTo(w*.86,h*.535);
    ctx.lineTo(w*.92,h*.55);ctx.lineTo(w*.96,h*.565);ctx.lineTo(w*.96,h*.603);ctx.lineTo(w*.74,h*.603);
    ctx.closePath();ctx.fill();
    const lx=w*.865,by=h*.548;
    ctx.fillStyle='rgba(230,236,243,.14)';ctx.beginPath();
    ctx.moveTo(lx-5,by);ctx.lineTo(lx+5,by);ctx.lineTo(lx+3,by-28);ctx.lineTo(lx-3,by-28);ctx.closePath();ctx.fill();
    ctx.fillStyle='rgba(240,244,248,.18)';ctx.beginPath();
    ctx.moveTo(lx-6,by-28);ctx.lineTo(lx+6,by-28);ctx.lineTo(lx,by-36);ctx.closePath();ctx.fill();
    ctx.fillStyle='rgba(250,250,245,.20)';ctx.fillRect(lx-1.3,by-24,2.6,6);
    drawBeam(lx,by-23,time);
    // A few broken specular glints on the water, NOT a vertical rectangle.
    // Keeping each glint aligned to its wave prevents a floating column.
    for(let k=0;k<4;k++){
      const x=moonX+Math.sin(time*.35+k*1.7)*(14+k*9);
      const y=waveHeight(x,h*(.57+k*.06),7+k*2,52+k*11,.75+k*.08);
      const gleam=.028 + .012*Math.sin(time*.25+k);
      ctx.strokeStyle=`rgba(237,238,221,${Math.max(0,gleam).toFixed(3)})`;
      ctx.lineWidth=1.1;ctx.beginPath();ctx.moveTo(x-(8+k*3),y-2);ctx.lineTo(x+(8+k*3),y-2);ctx.stroke();
    }
    fillWave(wave1,'rgba(14,34,52,.18)');strokeWave(wave1,'rgba(122,194,228,.18)',1.5);
    // extra soft overlap haze where the top wave passes in front of the island
    ctx.save(); ctx.strokeStyle='rgba(122,194,228,.09)'; ctx.lineWidth=6; ctx.filter='blur(5px)'; ctx.beginPath();
    wave1.forEach((p,i)=>{ if(i===0) ctx.moveTo(p[0],p[1]); else ctx.lineTo(p[0],p[1]);}); ctx.stroke(); ctx.restore();
    fillWave(wave2,'rgba(13,31,48,.24)');strokeWave(wave2,'rgba(128,198,232,.20)',1.7);
    fillWave(wave3,'rgba(11,27,42,.30)');strokeWave(wave3,'rgba(136,202,236,.24)',1.9);
    drawBoat();
    fillWave(wave4,'rgba(9,24,36,.40)');strokeWave(wave4,'rgba(145,208,239,.28)',2);
    fillWave(wave5,'rgba(7,20,31,.58)');strokeWave(wave5,'rgba(154,213,242,.30)',2.2);
    drawMotes(time);
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);

  resize();
})();
</script>
</body></html>
