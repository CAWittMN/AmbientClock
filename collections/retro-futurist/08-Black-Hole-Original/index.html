<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#03050a"><title>EVENT HORIZON — Black Hole Clock</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;background:#020308;color:#f8f5ed;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
.scene{position:relative;width:100%;height:100dvh;overflow:hidden;background:radial-gradient(ellipse at 50% 46%,#0c0b10 0%,#04050a 60%,#010205 100%);isolation:isolate;display:grid;place-items:center}
#universe{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:1}
.void-time{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);z-index:2;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;white-space:nowrap;width:min(31vw,260px);min-width:150px;pointer-events:none;text-shadow:0 1px 5px #000;user-select:none}
.kicker{font-size:clamp(8px,.75vw,12px);font-weight:500;letter-spacing:.28em;margin-right:-.28em;color:#888782;text-transform:uppercase}
.vtime{font-variant-numeric:tabular-nums;font-size:clamp(28px,3.4vw,54px);font-weight:200;letter-spacing:.02em;color:#f3f2ed;line-height:1.4;text-shadow:0 0 9px #ffffff20}
.seconds{font-size:.44em;vertical-align:.18em;color:#d5c9ae;letter-spacing:.02em}.ampm{font-size:.28em;vertical-align:.23em;color:#9e9a8f;letter-spacing:.06em;margin-left:.22em}
.line{width:45%;height:1px;margin:1px auto 9px;background:linear-gradient(90deg,transparent,#c2a98472,transparent)}
.day{font-size:clamp(9px,.9vw,13px);letter-spacing:.30em;margin-right:-.30em;color:#d8c5a9;text-transform:uppercase}.date{margin-top:5px;font-size:clamp(8px,.8vw,11px);letter-spacing:.15em;color:#8f8980;text-transform:uppercase}
.topline{position:absolute;z-index:2;top:6%;width:100%;text-align:center;letter-spacing:.45em;font-size:clamp(9px,.84vw,13px);color:#706f77;opacity:.9}.bottomline{position:absolute;z-index:2;bottom:6%;width:100%;text-align:center;letter-spacing:.3em;font-size:clamp(9px,.82vw,12px);color:#656776}
.bottomline b{font-weight:400;color:#ba9470}.subtle{animation:inhale 14s ease-in-out infinite alternate}@keyframes inhale{to{opacity:.62}}
@media(max-width:700px){.void-time{width:55vw}.topline{top:7%}.bottomline{bottom:6%}.kicker{font-size:7px}.date{font-size:8px}}
@media(prefers-reduced-motion:reduce){.subtle{animation:none}}
</style></head><body><main class="scene" id="scene"><canvas id="universe" aria-label="Animated black hole with a flowing accretion disk, lensing arcs, and photon ring"></canvas>
<div class="topline">A STUDY IN SPACETIME</div>
<div class="void-time"><div class="kicker">LOCAL TIME</div><div id="clock" class="vtime">6:17<span class="seconds">:02</span><span class="ampm">PM</span></div><div class="line"></div><div id="day" class="day">TUESDAY</div><div id="date" class="date">NOVEMBER 17, 2026</div></div>
<div class="bottomline subtle">EVENT HORIZON <b>·</b> CHRONOMETRY</div></main>
<script>
(()=>{
const root=document.getElementById('scene'),canvas=document.getElementById('universe'),ctx=canvas.getContext('2d',{alpha:true});const timeEl=document.getElementById('clock'),dayEl=document.getElementById('day'),dateEl=document.getElementById('date');const reduced=matchMedia('(prefers-reduced-motion:reduce)');
let W=0,H=0,R=0,cx=0,cy=0,dpr=1,lastSec=-1,lastFrame=-1000;
const rand=(n)=>{const v=Math.sin(n*127.1+45.63)*43758.5453;return v-Math.floor(v)};
const dust=[];for(let i=0;i<2100;i++){let radial=1.12+2.34*Math.pow(rand(i*13+4),.91);let theta=rand(i*7+11)*Math.PI*2;dust.push({r:radial,t:theta,sz:.5+rand(i*13+78)*1.8,v:.5+rand(i*9+3)*.8,tint:rand(i*17+3),alpha:.12+rand(i*11+56)*.58})}
const stars=[];for(let i=0;i<120;i++){stars.push({x:rand(i*17+1),y:rand(i*23+3),size:.3+rand(i*29+7)*1.2,alpha:.08+rand(i*7+2)*.28})}
function resize(){let b=root.getBoundingClientRect();W=b.width;H=b.height;dpr=Math.min(devicePixelRatio||1,1.6);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);cx=W*.5;cy=H*.45;R=Math.min(W*.123,H*.205,183)}
function xy(r,t,side){let x=cx+R*r*Math.cos(t);let isBack=side==='back';let sin=Math.abs(Math.sin(t));let y=cy+(isBack?-1:1)*R*r*.255*sin;
let lens=Math.exp(-Math.pow((x-cx)/(R*1.8),2));
if(isBack)y-=R*(.73+.08*(r-1.15))*lens;
else y+=R*(.70+.07*(r-1.15))*lens;
// Mild relativistic swirl of the apparent disk, stronger near the black hole
x+=R*.035*Math.sin(t*2)*Math.exp(-(r-1.12));
return{x,y};}
function color(r,theta,alpha,hot=0){let u=(r-1.12)/2.34;let boost=Math.pow((1-Math.cos(theta))*.5,1.7);let h=14+24*u+8*(1-boost);let sat=90-25*(1-u)*hot;let l=34+27*(1-u)+28*boost+hot*14;return`hsla(${h.toFixed(0)},${Math.min(100,sat).toFixed(0)}%,${Math.min(94,l).toFixed(0)}%,${alpha})`}
function background(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#020308';ctx.fillRect(0,0,W,H);
let g=ctx.createRadialGradient(cx,cy,R*.5,cx,cy,R*4.3);g.addColorStop(0,'rgba(132,59,28,.12)');g.addColorStop(.45,'rgba(66,35,26,.055)');g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
for(let s of stars){ctx.fillStyle=`rgba(198,208,229,${s.alpha})`;ctx.beginPath();ctx.arc(s.x*W,s.y*H,s.size,0,Math.PI*2);ctx.fill()}}
function diskLayer(side,tsec){ctx.save();ctx.globalCompositeOperation='screen';
// Diffuse continuous hot bands create a smooth accretion flow beneath its filaments.
for(let j=27;j>=0;j--){let r=1.16+j*.069,begin=side==='back'?Math.PI:0,end=side==='back'?Math.PI*2:Math.PI;ctx.beginPath();for(let i=0;i<=115;i++){let th=begin+(end-begin)*(i/115);let p=xy(r,th,side);i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y)}
let fading=Math.exp(-Math.pow((r-1.58)/1.2,2)),b=side==='front'?.64:.86;ctx.strokeStyle=color(r,Math.PI,.105+.18*fading*b);ctx.lineWidth=R*(.015+.016*fading);ctx.shadowColor='rgba(255,116,53,.2)';ctx.shadowBlur=j%7===0?R*.065:0;ctx.stroke()}
ctx.shadowBlur=0;
// A few much hotter filaments create the uneven luminous arcs of an accretion disk.
// The viewer's left side is brighter to evoke Doppler boosting.
for(let ring=0;ring<22;ring++){
  const r=1.15+ring*.074;
  for(let q=0;q<36;q++){
    const start=(side==='back'?Math.PI:0)+q*Math.PI/36;
    const theta=start+tsec*.009/(r*r);
    const p1=xy(r,theta,side),p2=xy(r,theta+.064,side);
    const approach=Math.pow((1-Math.cos(theta))*.5,1.45);
    const strength=(.018+.18*approach)*Math.exp(-Math.pow((r-1.43)/1.1,2));
    ctx.strokeStyle=color(r,theta,strength,.8);
    ctx.lineWidth=(.5+1.55*approach)*(R/180);
    ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);ctx.stroke();
  }
}
// Orbiting turbulent filaments. Inner particles rotate faster (Kepler-like angular falloff).
for(let i=0;i<dust.length;i++){const q=dust[i];const th=(q.t+tsec*.19*q.v/Math.pow(q.r,.72))%(Math.PI*2);let back=th>=Math.PI;if(back!==(side==='back'))continue;const a=xy(q.r,th,side),b=xy(q.r,th+.006+q.sz*.004,side);let boost=.3+.85*Math.pow((1-Math.cos(th))*.5,2);let alpha=q.alpha*boost*1.45*(1-(q.r-1.12)/3.45);ctx.lineWidth=q.sz*(R/180)*.95;ctx.strokeStyle=color(q.r,th,alpha,q.tint);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}
ctx.restore()}
function innerAccretionArcs(){
 ctx.save();ctx.globalCompositeOperation='screen';
 const hot=ctx.createLinearGradient(cx-R*1.6,cy,cx+R*1.6,cy);
 hot.addColorStop(0,'rgba(255,240,192,.90)');hot.addColorStop(.25,'rgba(255,175,91,.66)');hot.addColorStop(.58,'rgba(255,122,58,.45)');hot.addColorStop(1,'rgba(185,63,31,.15)');
 for(let side of ['back','front'])for(let k=0;k<4;k++){
  let r=1.15+k*.063, begin=side==='back'?Math.PI:0, end=side==='back'?Math.PI*2:Math.PI;
  ctx.beginPath();for(let i=0;i<=100;i++){let th=begin+(end-begin)*i/100,p=xy(r,th,side);i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)}
  ctx.strokeStyle=hot;ctx.lineWidth=R*(k===0?.015:.010);ctx.shadowColor='#ffa855';ctx.shadowBlur=R*(k===0?.082:.04);ctx.globalAlpha=.8-k*.13;ctx.stroke();
 }
 ctx.restore();
}
function shadow(){// Extremely dark central shadow, with a very thin atmospheric absorption edge
const glow=ctx.createRadialGradient(cx,cy,R*.8,cx,cy,R*1.34);glow.addColorStop(0,'rgba(0,0,0,0)');glow.addColorStop(.34,'rgba(5,3,7,.74)');glow.addColorStop(.55,'rgba(27,14,11,.11)');glow.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=glow;ctx.fillRect(cx-R*1.5,cy-R*1.5,R*3,R*3);
ctx.beginPath();ctx.arc(cx,cy,R*.995,0,Math.PI*2);ctx.fillStyle='#010204';ctx.fill();
ctx.save();ctx.beginPath();ctx.arc(cx,cy,R*1.011,0,Math.PI*2);ctx.strokeStyle='rgba(255,199,114,.13)';ctx.lineWidth=R*.016;ctx.shadowColor='#ed9958';ctx.shadowBlur=R*.095;ctx.stroke();ctx.restore()}
function photonRing(tsec){// Thin gravitational lensing ring (artistic approximation, not full GR ray tracing).
ctx.save();ctx.globalCompositeOperation='screen';ctx.beginPath();ctx.arc(cx,cy,R*1.048,0,2*Math.PI);ctx.strokeStyle='rgba(255,224,164,.28)';ctx.lineWidth=R*.010;ctx.shadowColor='#ffb477';ctx.shadowBlur=R*.060;ctx.stroke();
ctx.beginPath();ctx.arc(cx,cy,R*1.057,Math.PI*.65,Math.PI*1.52);ctx.strokeStyle='rgba(255,243,203,.58)';ctx.lineWidth=R*.014;ctx.shadowColor='#ffe2a9';ctx.shadowBlur=R*.12;ctx.stroke();
// The rapidly circling inner disk appears as a narrow, uneven luminous arc.
let phase=tsec*.17;ctx.beginPath();ctx.arc(cx,cy,R*1.10,phase,phase+.55);ctx.strokeStyle='rgba(255,247,197,.5)';ctx.lineWidth=R*.01;ctx.stroke();ctx.restore()}
function haze(){ctx.save();ctx.translate(cx,cy);ctx.scale(2.6,.56);let g=ctx.createRadialGradient(0,0,R*.15,0,0,R*1.23);g.addColorStop(0,'rgba(255,192,112,.18)');g.addColorStop(.43,'rgba(255,124,67,.16)');g.addColorStop(.8,'rgba(220,66,24,.04)');g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(-R*1.4,-R*1.4,R*2.8,R*2.8);ctx.restore()}
function render(ts){const tsec=reduced.matches?0:ts/1000;background();haze();diskLayer('back',tsec);diskLayer('front',tsec);innerAccretionArcs();shadow();photonRing(tsec)}
function clock(){let d=new Date(),s=d.getSeconds();if(s!==lastSec){lastSec=s;let h=d.getHours()%12||12;timeEl.innerHTML=`${h}:${String(d.getMinutes()).padStart(2,'0')}<span class="seconds">:${String(s).padStart(2,'0')}</span><span class="ampm">${d.getHours()<12?'AM':'PM'}</span>`;dayEl.textContent=new Intl.DateTimeFormat('en-US',{weekday:'long'}).format(d).toUpperCase();dateEl.textContent=new Intl.DateTimeFormat('en-US',{month:'long',day:'numeric',year:'numeric'}).format(d).toUpperCase()}}
function frame(t){clock();if(t-lastFrame>40){render(t);lastFrame=t}requestAnimationFrame(frame)}window.addEventListener('resize',resize,{passive:true});resize();requestAnimationFrame(frame);
})();
</script></body></html>
