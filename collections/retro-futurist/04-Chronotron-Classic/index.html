<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CHRONOTRON — Atomic Observatory • Clean Edition</title><style>
:root{color-scheme:dark;--mint:#b7f4dc;--phosphor:#6fdbbc;--orange:#ffce86;--ink:#080f1a}*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;background:#050a13;color:#d5f4e8;font-family:"Trebuchet MS",Arial,sans-serif}
.scene{position:relative;width:100%;height:100dvh;min-height:380px;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(ellipse at 50% 43%,#1b3940 0%,#0b1d2a 35%,#080e1d 70%,#050916 100%)}
.scene:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.24;background-image:linear-gradient(#8bf9d00b 1px,transparent 1px),linear-gradient(90deg,#8bf9d00b 1px,transparent 1px),radial-gradient(1px 1px at 14% 21%,#d0ffe6 99%,transparent),radial-gradient(1px 1px at 83% 16%,#d0ffe6 99%,transparent),radial-gradient(1px 1px at 78% 74%,#d0ffe6 99%,transparent);background-size:58px 58px,58px 58px,auto,auto,auto}
.scene:after{content:"";position:absolute;inset:-30%;background:radial-gradient(ellipse,#3ddfa91e 0%,transparent 42%);filter:blur(50px);pointer-events:none;animation:aura 18s ease-in-out infinite alternate}@keyframes aura{to{opacity:.28;transform:scale(1.2)}}
header{position:absolute;top:4%;left:0;width:100%;text-align:center;z-index:3}.micro{font-family:monospace;font-size:clamp(9px,.85vw,13px);letter-spacing:.38em;color:#80c8b7}.brand{font-family:Georgia,serif;font-size:clamp(32px,4vw,60px);font-weight:normal;letter-spacing:.22em;margin:6px 0 2px;color:#d5ffe2;text-shadow:0 0 22px #72ffc04e}.sub{font-size:clamp(9px,.82vw,13px);letter-spacing:.3em;color:#b6ae7b}
.orbit-system{position:relative;z-index:2;width:min(69vw,68vh,620px);aspect-ratio:1;display:grid;place-items:center;margin-top:1vh}
.orbit-system>svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 13px #56cdae28)}
.orbit{transform-origin:260px 260px}.orbit.a{animation:spin1 110s linear infinite}.orbit.b{animation:spin2 150s linear infinite reverse}.orbit.c{animation:spin1 205s linear infinite}@keyframes spin1{to{transform:rotate(360deg)}}@keyframes spin2{to{transform:rotate(360deg)}}
.particle{fill:#fff2bb;filter:drop-shadow(0 0 7px #fef0a8)}.photon{stroke:#adffe8;stroke-width:1;fill:none;opacity:.3}.fine{stroke:#80d5be;fill:none;opacity:.26;stroke-width:1}.ring{stroke:#93e3cb;fill:none;stroke-width:1.2;opacity:.56}
.clock-hand{stroke-linecap:round}.hour{stroke:#f4e6bd;stroke-width:7;filter:drop-shadow(0 0 4px #f6db9b77)}.minute{stroke:#d2ffeb;stroke-width:4;filter:drop-shadow(0 0 5px #7effd088)}.second{stroke:#ffa968;stroke-width:2;filter:drop-shadow(0 0 4px #ffc27c88)}
.panel{position:absolute;z-index:2;top:43%;width:min(17vw,215px);font-family:monospace;color:#9bdaca;font-size:clamp(9px,.85vw,12px);letter-spacing:.16em;opacity:.78}.left{left:4%}.right{right:4%;text-align:right}.panel .panel-title{color:#edd69a;letter-spacing:.21em;margin-bottom:12px;border-bottom:1px solid #8abda04a;padding-bottom:12px}.panel .data{display:block;margin:14px 0 8px;color:#b3dacf}.bar{height:2px;border:none;margin:14px 0 0;width:70%;background:linear-gradient(90deg,#75f1b48c,transparent);box-shadow:0 0 6px #6df3b52b}.right .bar{margin-left:auto;background:linear-gradient(90deg,transparent,#ffc77888)}
.readout{position:absolute;z-index:4;left:50%;bottom:5.8%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;text-align:center;gap:7px;width:min(80vw,680px);background:linear-gradient(90deg,transparent,#09232d99 20%,#09232d99 80%,transparent);padding:12px}.readout:before,.readout:after{content:"";width:75%;height:1px;background:linear-gradient(90deg,transparent,#65d6be99,transparent)}
.day{letter-spacing:.33em;font-size:clamp(10px,.93vw,14px);color:#9ae2c9}.time{font-family:"Courier New",monospace;font-size:clamp(29px,4vw,58px);letter-spacing:.13em;font-weight:bold;color:#e5ffdf;font-variant-numeric:tabular-nums;text-shadow:0 0 10px #a8ffc16b,0 0 24px #75f7ad2c}.date{letter-spacing:.24em;font-size:clamp(10px,.95vw,14px);color:#dfcc99}
.blink{animation:blink 3.6s steps(1) infinite}@keyframes blink{50%{opacity:.24}}
@media(max-width:850px){.panel{display:none}.orbit-system{width:min(85vw,61vh)}header{top:3%}.readout{bottom:4%}}
@media(max-height:620px){header{top:2%}.brand{font-size:25px}.sub,.micro{font-size:9px}.orbit-system{width:min(54vh,55vw)}.readout{bottom:1%;gap:3px;padding:4px}.time{font-size:28px}}
@media(prefers-reduced-motion:reduce){.scene:after,.orbit,.blink{animation:none}}
</style></head><body><main class="scene">
<header><div class="micro">INSTITUTE OF TOMORROW • TEMPORAL SCIENCES</div><h1 class="brand">CHRONOTRON</h1><div class="sub">ATOMIC OBSERVATORY / MODEL 48-A</div></header>
<aside class="panel left"><div class="panel-title">ATOMIC STANDARD</div><span class="data">PHASE LOCKED <span class="blink">●</span></span><div class="bar"></div></aside>
<aside class="panel right"><div class="panel-title">EARTH REFERENCE</div><span class="data">LOCAL TIME <span class="blink">●</span></span><div class="bar"></div></aside>
<section class="orbit-system"><svg viewBox="0 0 520 520" aria-label="Animated atomic ring clock">
<defs><radialGradient id="core"><stop stop-color="#123c45"/><stop offset=".78" stop-color="#081e2b"/><stop offset="1" stop-color="#07121d"/></radialGradient></defs>
<circle cx="260" cy="260" r="222" class="fine" stroke-dasharray="3 10"/><circle cx="260" cy="260" r="244" class="fine" stroke-dasharray="1 20"/>
<g class="orbit a"><ellipse cx="260" cy="260" rx="229" ry="87" transform="rotate(-32 260 260)" class="ring"/><ellipse cx="260" cy="260" rx="230" ry="89" transform="rotate(-32 260 260)" class="photon" stroke-width="6" opacity=".1"/><circle class="particle" cx="62" cy="375" r="4.5"/></g>
<g class="orbit b"><ellipse cx="260" cy="260" rx="225" ry="88" transform="rotate(34 260 260)" class="ring"/><circle class="particle" cx="449" cy="387" r="3.5"/></g>
<g class="orbit c"><ellipse cx="260" cy="260" rx="215" ry="91" transform="rotate(90 260 260)" class="ring"/><circle class="particle" cx="260" cy="45" r="3.5"/></g>
<circle cx="260" cy="260" r="173" fill="url(#core)" stroke="#a4f9dd" stroke-opacity=".6" stroke-width="2"/><circle cx="260" cy="260" r="163" class="fine"/><circle cx="260" cy="260" r="136" class="fine" stroke-dasharray="2 8"/><g id="ticks"></g>
<text x="260" y="190" font-size="12" text-anchor="middle" fill="#a8d6b8" font-family="monospace" letter-spacing="4">ATOMIC STANDARD</text>
<g id="hour"><path d="M260 274 L260 165" class="clock-hand hour"/></g><g id="minute"><path d="M260 278 L260 126" class="clock-hand minute"/></g><g id="second"><path d="M260 297 L260 109" class="clock-hand second"/></g><circle cx="260" cy="260" r="7" fill="#ffffda" stroke="#509f8c" stroke-width="2"/>
<text x="260" y="335" font-size="11" text-anchor="middle" fill="#adceba" font-family="monospace" letter-spacing="4">LOCAL • EARTH</text>
</svg></section>
<div class="readout"><div id="day" class="day">TUESDAY</div><div id="time" class="time">10:52:50 AM</div><div id="date" class="date">NOVEMBER 17, 2026</div></div>
</main><script>(()=>{const ns='http://www.w3.org/2000/svg',ticks=document.getElementById('ticks');for(let i=0;i<60;i++){const a=i*Math.PI/30,major=i%5===0,r1=major?147:155,r2=major?163:160;const e=document.createElementNS(ns,'line');for(let [k,v] of Object.entries({x1:260+Math.sin(a)*r1,y1:260-Math.cos(a)*r1,x2:260+Math.sin(a)*r2,y2:260-Math.cos(a)*r2,stroke:major?'#b6ffe0':'#65ab9d','stroke-width':major?2.3:.8,opacity:major?.9:.5}))e.setAttribute(k,v);ticks.append(e)}const hour=document.getElementById('hour'),minute=document.getElementById('minute'),second=document.getElementById('second'),day=document.getElementById('day'),date=document.getElementById('date'),time=document.getElementById('time');let last=-1;function frame(){const d=new Date(),s=d.getSeconds()+d.getMilliseconds()/1000,m=d.getMinutes()+s/60,h=d.getHours()%12+m/60;hour.setAttribute('transform',`rotate(${h*30} 260 260)`);minute.setAttribute('transform',`rotate(${m*6} 260 260)`);second.setAttribute('transform',`rotate(${s*6} 260 260)`);if(d.getSeconds()!==last){last=d.getSeconds();day.textContent=new Intl.DateTimeFormat('en-US',{weekday:'long'}).format(d).toUpperCase();date.textContent=new Intl.DateTimeFormat('en-US',{month:'long',day:'numeric',year:'numeric'}).format(d).toUpperCase();time.textContent=new Intl.DateTimeFormat('en-US',{hour:'numeric',minute:'2-digit',second:'2-digit',hour12:true}).format(d)}requestAnimationFrame(frame)}requestAnimationFrame(frame)})();</script></body></html>
