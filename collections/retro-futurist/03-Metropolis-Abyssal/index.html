/* Water bubbles are now drawn INSIDE the console, above its opaque background.
   Explicit per-particle timings avoid CSS calc() syntax that WebKit may reject. */
.pelagic-bubbles{position:absolute;inset:0;z-index:3;overflow:hidden;pointer-events:none;
  -webkit-mask-image:linear-gradient(90deg,#000 0%,#000 33%,transparent 43%,transparent 57%,#000 67%,#000 100%);

  border-radius:50%;border:1px solid rgba(141,226,213,.43);
  background:radial-gradient(circle at 31% 24%,rgba(221,255,248,.30),rgba(112,208,197,.07) 33%,transparent 70%);
  box-shadow:inset -2px -2px 4px rgba(53,181,168,.22),0 0 7px rgba(73,204,199,.17);
  opacity:0;will-change:transform,opacity;animation:pelagicRise var(--duration) linear infinite;
  animation-delay:var(--delay)}
